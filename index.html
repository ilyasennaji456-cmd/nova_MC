<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050508;
    --surface: #0d0d14;
    --card: #12121e;
    --border: #1e1e30;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --glow: #7c3aed88;
    --text: #e2e2f0;
    --muted: #6b6b8a;
    --white: #ffffff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
    overflow-x: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, #7c3aed22 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px;
    right: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #a855f711 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    margin-bottom: 20px;
    animation: fadeDown 0.6s ease both;
  }
  .avatar-ring {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent2), #ec4899);
    box-shadow: 0 0 30px var(--glow), 0 0 60px #7c3aed33;
    animation: spin-ring 6s linear infinite;
  }
  @keyframes spin-ring {
    0% { background: linear-gradient(135deg, #7c3aed, #a855f7, #ec4899); }
    33% { background: linear-gradient(225deg, #a855f7, #ec4899, #7c3aed); }
    66% { background: linear-gradient(315deg, #ec4899, #7c3aed, #a855f7); }
    100% { background: linear-gradient(135deg, #7c3aed, #a855f7, #ec4899); }
  }
  .avatar-ring img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid var(--bg);
    object-fit: cover;
    display: block;
  }

  /* Online badge */
  .live-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    background: #22c55e;
    border: 2px solid var(--bg);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    animation: pulse-live 2s ease-in-out infinite;
  }
  @keyframes pulse-live {
    0%, 100% { box-shadow: 0 0 0 0 #22c55e88; }
    50% { box-shadow: 0 0 0 6px #22c55e00; }
  }

  /* Name */
  .name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--white) 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeDown 0.7s 0.1s ease both;
  }

  /* Tag */
  .tag {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
    margin-bottom: 32px;
    animation: fadeDown 0.7s 0.2s ease both;
  }

  /* Section label */
  .section-label {
    font-size: 0.65rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    margin-top: 10px;
    animation: fadeDown 0.7s 0.3s ease both;
  }
  .section-label::before, .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Link cards */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
    animation: fadeUp 0.5s ease both;
  }
  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--glow-color, var(--glow)), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    transform: translateX(-100%);
  }
  .link-card:hover::before {
    opacity: 1;
    animation: shimmer 0.6s ease forwards;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  .link-card:hover {
    border-color: var(--accent2);
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 30px var(--glow);
  }
  .link-card:active { transform: scale(0.98); }

  .link-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.15rem;
  }

  .link-info {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .link-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--white);
  }
  .link-sub {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 1px;
  }

  .link-arrow {
    color: var(--muted);
    font-size: 0.85rem;
    transition: transform 0.2s, color 0.2s;
  }
  .link-card:hover .link-arrow {
    transform: translateX(3px);
    color: var(--accent2);
  }

  /* Icon backgrounds per platform */
  .ic-twitch { background: #9147ff22; color: #9147ff; }
  .ic-youtube { background: #ff000022; color: #ff4444; }
  .ic-discord { background: #5865f222; color: #7289da; }
  .ic-instagram { background: #e1306c22; color: #e1306c; }
  .ic-x { background: #ffffff16; color: #ffffff; }
  .ic-valorant { background: #ff4655aa; color: #ff4655; background: #ff465522; }
  .ic-web { background: var(--accent)22; color: var(--accent2); }

  /* Staggered animation delays */
  .link-card:nth-child(1) { animation-delay: 0.35s; }
  .link-card:nth-child(2) { animation-delay: 0.42s; }
  .link-card:nth-child(3) { animation-delay: 0.49s; }
  .link-card:nth-child(4) { animation-delay: 0.56s; }
  .link-card:nth-child(5) { animation-delay: 0.63s; }
  .link-card:nth-child(6) { animation-delay: 0.70s; }
  .link-card:nth-child(7) { animation-delay: 0.77s; }

  /* Footer */
  .footer {
    margin-top: 48px;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: fadeDown 0.7s 0.9s ease both;
    opacity: 0.5;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scanline overlay for gaming feel */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 999;
  }
</style>
